let totalDocs = 0;
let importedDocs = 0;

function log(msg, type) {
  var el = document.getElementById('log');
  var div = document.createElement('div');
  div.className = type || 'info';
  div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function updateProgress() {
  var pct = totalDocs > 0 ? Math.round((importedDocs / totalDocs) * 100) : 0;
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('status').textContent = 'Import en cours... ' + importedDocs + '/' + totalDocs + ' documents (' + pct + '%)';
}

async function importCollection(name, data) {
  log('📂 Collection: ' + name + ' (' + data.length + ' documents)', 'info');
  for (var i = 0; i < data.length; i++) {
    try {
      var label = data[i].nom || data[i].mot_fr || data[i].type || data[i].titre || 'doc';
      await db.collection(name).add(data[i]);
      importedDocs++;
      updateProgress();
      log('  ✅ ' + label + ' importé', 'success');
    } catch(e) {
      log('  ❌ Erreur: ' + e.message, 'error');
    }
  }
}

async function startImport() {
  document.getElementById('importBtn').disabled = true;
  var collections = Object.keys(DATA);
  totalDocs = 0;
  for (var k of collections) totalDocs += DATA[k].length;
  importedDocs = 0;

  log('🚀 Démarrage import Go Morocco...', 'info');
  log('📊 Total: ' + totalDocs + ' documents à importer', 'info');

  for (var name of collections) {
    await importCollection(name, DATA[name]);
  }

  document.getElementById('progress').style.width = '100%';
  document.getElementById('status').textContent = '✅ Import terminé ! ' + importedDocs + ' documents dans Firebase.';
  log('🎉 Import terminé avec succès !', 'success');
  log('👉 Vérifie sur console.firebase.google.com', 'info');
  document.getElementById('importBtn').disabled = false;
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
}
